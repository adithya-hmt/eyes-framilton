[package]
name = "eyes"
version = "0.1.0"
description = "A local, cross-platform work memory recorder."
authors = ["Framilton"]
edition = "2021"

[lib]
name = "eyes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }

# Platform readers stay optional at the dependency level. The shared writer,
# redaction, and segmentation code never needs to know which desktop it runs on.
[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25"

[dev-dependencies]
tempfile = "3"
